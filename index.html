<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toolbar">
    <select id="skin-select" aria-label="Skin de los bloques" title="Skin"></select>
    <button id="mute-toggle" type="button" aria-label="Silenciar sonido" aria-pressed="false">🔊</button>
    <button id="theme-toggle" type="button" aria-label="Cambiar tema" aria-pressed="false">☀ Claro</button>
  </div>
  <h1 class="game-title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">-</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section hidden" id="objective-section">
          <span class="label">OBJETIVO</span>
          <span class="objective-text" id="objective"></span>
          <span class="value value-sm" id="timer"></span>
          <span class="objective-text" id="progress"></span>
        </div>

        <div class="panel-section status" id="status" aria-live="polite"></div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="save-score" class="save-score hidden">
          <span class="records-new" id="save-score-msg">¡Nuevo récord!</span>
          <div class="save-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" aria-label="Nombre del jugador" />
            <button id="save-btn" class="btn btn-sm" type="button">Guardar</button>
          </div>
        </div>
        <div id="overlay-records" class="records hidden"></div>
        <button id="next-btn" class="btn hidden" type="button">Siguiente nivel</button>
        <button id="restart-btn" class="btn" type="button">Reiniciar</button>
        <button id="menu-btn" class="btn btn-secondary" type="button">Menú</button>
      </div>
    </div>

    <div id="menu" class="overlay hidden">
      <div class="overlay-box">
        <p class="menu-title">TETRIS</p>
        <div id="menu-main" class="menu-group">
          <button id="menu-classic" class="btn" type="button">Clásico</button>
          <button id="menu-challenge" class="btn" type="button">Desafío</button>
          <div id="menu-records" class="records"></div>
          <button id="reset-records-btn" class="btn btn-secondary btn-sm" type="button">Borrar récords</button>
        </div>
        <div id="challenge-list" class="menu-group hidden"></div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
